<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Volantino Fiesta Scout 2026</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Permanent+Marker&display=swap');

    body {
      background-color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    .volantino {
      width: 100%;
      max-width: 550px;
      background: #ffffff;
      border: 8px solid #2d5a27;
      border-radius: 20px;
      padding: 30px;
      box-shadow: none;
      text-align: center;
      box-sizing: border-box;
    }

    .header-tag {
      background: #2d5a27;
      color: #ffffff;
      font-weight: bold;
      letter-spacing: 2px;
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-block;
      font-size: 0.85rem;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Permanent Marker', cursive;
      color: #2d5a27;
      font-size: 2.8rem;
      margin: 10px 0;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .badge-data {
      background: #e76f51;
      color: white;
      font-size: 1.3rem;
      font-weight: 900;
      padding: 10px 20px;
      border-radius: 12px;
      display: inline-block;
      margin: 15px 0;
    }

    .location-box {
      background: #fdf6e2;
      border: 2px dashed #e76f51;
      border-radius: 12px;
      padding: 15px;
      margin: 20px 0;
    }

    .location-box h3 {
      margin: 0 0 5px 0;
      color: #264653;
      font-size: 1.1rem;
    }

    .location-box p {
      margin: 0;
      color: #2d5a27;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .qr-section {
      background: #fafafa;
      border: 2px solid #e0e0e0;
      border-radius: 15px;
      padding: 20px;
      margin-top: 25px;
    }

    .qr-section img {
      width: 170px;
      height: 170px;
      border-radius: 10px;
      border: 4px solid #ffffff;
    }

    .qr-section p {
      margin: 10px 0 0 0;
      font-size: 0.95rem;
      font-weight: bold;
      color: #555;
    }

    .footer-note {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #888;
      font-style: italic;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="volantino">
    <div class="header-tag">⛺ Grande Evento Scout</div>
    
    <h1>Fiesta Scout!</h1>
    
    <div class="badge-data">
      📅 Martedì 1 Settembre 2026
    </div>

    <div class="location-box">
      <h3>📍 DOVE TI ASPETTIAMO:</h3>
      <p>A Casa di Carla Scanerra</p>
    </div>

    <div class="qr-section">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://webstudioagency0.github.io/fiesta-scout-2026/" alt="QR Code Fiesta Scout">
      <p>📲 Inquadra il QR Code per accedere al sito ed unirti alla festa!</p>
    </div>

    <div class="footer-note">
      Non mancare! Porta il tuo entusiasmo e la voglia di fare festa insieme.
    </div>
  </div>

</body>
</html>
